<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تذكيرات واتساب | لوحة سمايل دنتال كير</title>
  <link rel="icon" href="../assets/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="top" id="topbar"></header>
      <div class="content">
        <div class="card">
          <div class="card-head"><h2>نص رسالة التذكير</h2></div>
          <p style="color:var(--muted);font-size:13.5px;margin-bottom:10px">المتغيرات: <code>{name}</code> <code>{date}</code> <code>{time}</code> <code>{doctor}</code> <code>{clinic}</code></p>
          <div class="field"><textarea id="tpl" rows="6"></textarea></div>
          <button class="btn btn-ghost btn-sm" id="saveTpl">حفظ النص</button>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>مواعيد يوم: <input type="date" id="day" style="padding:6px 10px;border:1.5px solid var(--line);border-radius:10px"></h2>
            <button class="btn btn-wa btn-sm" id="sendNext">ابعت للتالي ←</button>
          </div>
          <div class="table-wrap" id="list"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/admin-common.js"></script>
  <script src="../js/admin-reminders.js"></script>
</body>
</html>
