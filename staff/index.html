<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self' https://smile-api-56rj.onrender.com; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الرئيسية | لوحة سمايل دنتال كير</title>
  <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="top" id="topbar"></header>
      <div class="content">
        <div class="stats" id="stats"></div>
        <div class="card" id="reqCard" hidden>
          <div class="card-head"><h2>طلبات حجز من الموقع <small style="color:var(--muted);font-weight:600">(محتاجة اتصال/تأكيد)</small></h2></div>
          <div class="table-wrap" id="reqTable"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <h2 id="todayTitle">مواعيد النهارده</h2>
            <button class="btn btn-primary btn-sm" id="addAppt">+ موعد جديد</button>
          </div>
          <div class="table-wrap" id="todayTable"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>حجوزات جديدة محتاجة تأكيد</h2></div>
          <div class="table-wrap" id="pendingTable"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/boot.js" data-scripts="admin-common,admin-forms,admin-dashboard"></script>
</body>
</html>
