<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الحسابات والفواتير | لوحة سمايل دنتال كير</title>
  <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="top" id="topbar"></header>
      <div class="content">
        <div class="stats" id="stats"></div>
        <div class="toolbar">
          <input class="grow" id="q" type="search" placeholder="ابحث باسم المريض أو وصف الفاتورة">
          <select id="statusF">
            <option value="">كل الحالات</option>
            <option value="unpaid">غير مسدد</option>
            <option value="partial">مسدد جزئياً</option>
            <option value="paid">مسدد</option>
          </select>
          <button class="btn btn-primary btn-sm" id="newInv">+ فاتورة جديدة</button>
        </div>
        <div class="card"><div class="table-wrap" id="list"></div></div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-forms.js"></script>
  <script src="js/admin-billing.js"></script>
</body>
</html>
