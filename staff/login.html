<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://maps.google.com https://www.google.com; connect-src 'self' https://smile-api-56rj.onrender.com; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول الموظفين | سمايل دنتال كير</title>
  <link rel="icon" href="../images/logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand"><img src="../images/logo.jpg" alt=""><div><strong style="color:var(--primary)">سمايل دنتال كير</strong><small>لوحة إدارة العيادة</small></div></div>
      <h1>تسجيل الدخول</h1>
      <form id="loginForm">
        <div class="field"><label for="u">اسم المستخدم</label><input id="u" autocomplete="username" required></div>
        <div class="field"><label for="p">كلمة المرور</label><input id="p" type="password" autocomplete="current-password" required></div>
        <div class="field-error" id="err" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit">دخول</button>
      </form>
      <p style="text-align:center;margin-top:16px"><a href="../index.html" style="color:var(--muted);font-size:14px">← الرجوع للموقع</a></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
